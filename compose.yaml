services:
  postgres:
    image: postgres:16-alpine
    container_name: atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  atlas-control:
    build:
      context: ./services/atlas-control
      target: runtime
    container_name: atlas-control
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  atlas-control-tests:
    build:
      context: ./services/atlas-control
      target: test
    profiles:
      - test
    working_dir: /review/services/atlas-control
    volumes:
      - type: bind
        source: .
        target: /review
        read_only: true
    environment:
      ATLAS_CONVERSATION_MODEL: echo
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /review/services/atlas-control:/review/apps/atlas-workspace
    command: python -B -m pytest -q -p no:cacheprovider tests

  postgres-test:
    profiles: ["integration"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atlas_test
      POSTGRES_USER: atlas_test
      POSTGRES_PASSWORD: atlas_test_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas_test -d atlas_test"]
      interval: 5s
      timeout: 5s
      retries: 12
    tmpfs:
      - /var/lib/postgresql/data

  atlas-control-integration-tests:
    profiles: ["integration"]
    build:
      context: ./services/atlas-control
      target: test
    depends_on:
      postgres-test:
        condition: service_healthy
    working_dir: /review/services/atlas-control
    volumes:
      - type: bind
        source: .
        target: /review
        read_only: true
    environment:
      DATABASE_URL: postgresql://atlas_test:atlas_test_password@postgres-test:5432/atlas_test
      ATLAS_CONVERSATION_MODEL: echo
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /review/services/atlas-control:/review/apps/atlas-workspace
    command: python -B -m pytest -q -ra -p no:cacheprovider tests/integration

volumes:
  postgres_data:
